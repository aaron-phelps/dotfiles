# PRIORITY
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# GAMES
windowrule {
    name = fullscreen-full-opacity
    match:fullscreen = true
    opacity = 1.0
}

windowrule {
    name = geometry-dash-full-opacity
    match:title = ^(Geometry Dash)$
    opacity = 1.0
}

windowrule {
    name = counter-strike-full-opacity
    match:title = ^(Counter-Strike 2)$
    opacity = 1.0
}

windowrule {
    name = bunny-hop-full-opacity
    match:title = ^(Bunny Hop Eggstreme)$
    opacity = 1.0
}
